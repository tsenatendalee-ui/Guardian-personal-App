name: Guardian signed release and enrollment QR

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore private signing key
        env:
          KEYSTORE_B64: ${{ secrets.GUARDIAN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Missing GUARDIAN_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/guardian-release.jks"
          test -s "$RUNNER_TEMP/guardian-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/guardian-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GUARDIAN_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.GUARDIAN_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.GUARDIAN_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Guardian.apk
      - name: Create provisioning payload and QR
        run: |
          python -m pip install --quiet "qrcode[pil]"
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          import qrcode
          apk = Path("Guardian.apk")
          checksum = base64.urlsafe_b64encode(hashlib.sha256(apk.read_bytes()).digest()).decode().rstrip("=")
          tag = os.environ["GITHUB_REF_NAME"]
          url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/Guardian.apk"
          payload = {
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_COMPONENT_NAME": "com.guardian.personal/.GuardianAdminReceiver",
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_DOWNLOAD_LOCATION": url,
              "android.app.extra.PROVISIONING_DEVICE_ADMIN_PACKAGE_CHECKSUM": checksum
          }
          encoded = json.dumps(payload, separators=(",", ":"))
          Path("guardian-provisioning.json").write_text(encoded)
          qrcode.make(encoded).save("guardian-enrollment-qr.png")
          Path("Guardian.apk.sha256").write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + "  Guardian.apk\n")
          PY
      - name: Publish signed APK, checksum, and QR
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Guardian.apk
            Guardian.apk.sha256
            guardian-provisioning.json
            guardian-enrollment-qr.png
